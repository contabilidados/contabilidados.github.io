project:
  type: website
  output-dir: docs
  # App estático "Links DFs CVM" (copiado sem renderização para docs/cntdd_linksDFS/)
  resources:
    - "cntdd_linksDFS/**"
    - "assets/fontes/**"
    - "assets/leitura.js"
    - "share.png"
    - "assets/logos/**"

website:
  favicon: icon.png
  page-navigation: true
  back-to-top-navigation: true
  title: "contabiliDados"
  site-url: "https://contabilidados.com.br"
  description: "Grupo de pesquisa em contabilidade, finanças e dados do curso de Ciências Contábeis da UFERSA."
  image: share.png
  image-alt: "Logo do ContabiliDados"
  open-graph:
    locale: pt_BR
    site-name: ContabiliDados
  google-analytics: "G-H9V60F0CZM"
  page-footer:
    left: '<span class="marca-rodape">Contabili<span class="marca-dados">Dados</span></span><br>Contabilidade e Finanças · Ciências Contábeis da UFERSA'
    center: '[Posts](/posts.html) · [Eventos](/meetings.html) · [Pacote cntdd](/cntdd.html) · [Sobre](/membros.html)<br><span class="rodape-nota"><span class="nw">Licença <a href="https://creativecommons.org/licenses/by-sa/4.0/deed.pt-br" class="licenca-cc" title="Creative Commons Atribuição-CompartilhaIgual 4.0"><img src="/assets/logos/cc-cc.svg" alt="" class="cc-icone"><img src="/assets/logos/cc-by.svg" alt="" class="cc-icone"><img src="/assets/logos/cc-sa.svg" alt="" class="cc-icone"> <span class="cc-txt">CC BY-SA 4.0</span></a></span> · <span class="feito-com">Feito com <a href="https://www.r-project.org/" title="R"><img src="/assets/logos/r.svg" alt="R" class="logo-r"></a> e <a href="https://quarto.org/" title="Quarto"><img src="/assets/logos/quarto.svg" alt="Quarto" class="logo-quarto"></a></span> · <span class="nw">Modelo de [Beatriz Milz](https://beamilz.com/)</span></span>'
    right:
      - icon: instagram
        href: https://www.instagram.com/contabilidados
        aria-label: Instagram do ContabiliDados
      - icon: youtube
        href: https://www.youtube.com/watch?v=Bckx1xIqGto&list=PL2Kz0fa0V_r3ghh1iHWl31CYr5bVc0Jfo
        aria-label: Canal do ContabiliDados no YouTube
      - icon: github
        href: https://github.com/contabilidados
        aria-label: ContabiliDados no GitHub
      - icon: envelope
        href: mailto:contabilidados@ufersa.edu.br
        aria-label: E-mail do ContabiliDados
    border: true
  twitter-card:
    creator: "@cntdd"
    card-style: summary_large_image
  navbar:
    logo: "logo.png"
    tools:
      - icon: instagram
        href: https://www.instagram.com/contabilidados
        text: Instagram do ContabiliDados
      - icon: youtube
        href: https://www.youtube.com/watch?v=Bckx1xIqGto&list=PL2Kz0fa0V_r3ghh1iHWl31CYr5bVc0Jfo
        text: Canal do ContabiliDados no YouTube
      - icon: github
        href: https://github.com/contabilidados
        text: ContabiliDados no GitHub
    right:
      - text: Posts
        href: posts.qmd
      - text: Eventos
        href: meetings.qmd
      - text: cntdd
        href: cntdd.qmd
      - text: Dashboard
        menu:
          - text: Indicadores
            href: https://contabilidados-dfs.share.connect.posit.cloud/
            target: _blank
          - text: Links DFs CVM
            href: https://contabilidados.com.br/cntdd_linksDFS/
            target: _blank
          - text: Mercado
            href: https://gecomt.shinyapps.io/dashboard/
            target: _blank
      - text: Sobre
        href: membros.qmd
      - icon: rss
        href: index.xml
format:
  html:
    smooth-scroll: true
    theme:
      light: [sandstone, styles.css]
      dark: [cyborg, dark.css]
    link-external-icon: false
    link-external-newwindow: true
    link-external-filter: '^(?:http:|https:)\/\/(?:www\.)?contabilidados\.com\.br\/'
    citations-hover: true
    footnotes-hover: true
    toc: true
    code-link: true
    include-after-body:
      - text: '<script src="/assets/leitura.js" defer></script>'

lang: pt

editor: source

comments:
  giscus:
    repo: contabilidados/contabilidados.github.io
    repo-id: "R_kgDOI9xlkQ"
    category: "General"
    category-id: "DIC_kwDOI9xlkc4CUfYR"
    mapping: title
    language: pt
