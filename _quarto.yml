      - icon: rss
        href: index.xml
format:
  html:
    smooth-scroll: true
    theme:
      light: [sandstone, styles.css]
      dark: [cyborg, dark.css]
    link-external-icon: false
    link-external-newwindow: true
    link-external-filter: '^(?:http:|https:)\/\/www\.contabilidados\.com.br\/**'
    citations-hover: true
    footnotes-hover: true
    toc: true
    code-link: true

lang: pt

editor: source

