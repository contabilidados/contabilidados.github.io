    right:
      - icon: instagram
        href: https://www.instagram.com/contabilidados
        aria-label: Instagram do ContabiliDados
      - icon: youtube
        href: https://www.youtube.com/watch?v=Bckx1xIqGto&list=PL2Kz0fa0V_r3ghh1iHWl31CYr5bVc0Jfo
        aria-label: Canal do ContabiliDados no YouTube
      - icon: github
        href: https://github.com/contabilidados
        aria-label: ContabiliDados no GitHub
      - icon: envelope
        href: mailto:contabilidados@ufersa.edu.br
        aria-label: E-mail do ContabiliDados
    border: true
  twitter-card:
    creator: "@cntdd"
    card-style: summary_large_image
  navbar:
    logo: "logo.png"
    tools:
      - icon: instagram
        href: https://www.instagram.com/contabilidados
        text: Instagram do ContabiliDados
      - icon: youtube
        href: https://www.youtube.com/watch?v=Bckx1xIqGto&list=PL2Kz0fa0V_r3ghh1iHWl31CYr5bVc0Jfo
        text: Canal do ContabiliDados no YouTube
      - icon: github
        href: https://github.com/contabilidados
        text: ContabiliDados no GitHub
    right:
      - text: Posts
        href: posts.qmd
      - text: Eventos
        href: meetings.qmd
      - text: cntdd
        href: cntdd.qmd
      - text: Dashboard
