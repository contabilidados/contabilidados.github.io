project:
  type: website
  output-dir: docs
  # App estático "Links DFs CVM" (copiado sem renderização para docs/cntdd_linksDFS/)
  resources:
    - "cntdd_linksDFS/**"
    - "assets/fontes/**"

website:
  favicon: icon.png
  page-navigation: true
  back-to-top-navigation: true
  title: "contabiliDados"
  site-url: "https://contabilidados.com.br"
  google-analytics: "G-H9V60F0CZM"
  page-footer:
